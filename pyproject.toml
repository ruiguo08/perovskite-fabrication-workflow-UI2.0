[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perovskite-deposition-bo"
dynamic = ["version"]
description = "Laboratory workflow and system of record for perovskite solar-cell fabrication"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "ruiguo08" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.111,<1",
  "matplotlib>=3.10,<4",
  "pydantic>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.9,<1",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "aiosqlite>=0.20,<1",
  "httpx2>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
web = [
  "static-app/*.html",
  "static-app/**/*",
]

[tool.setuptools.dynamic]
version = { attr = "web.version.__version__" }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=1.18,<2",
    "ruff>=0.14,<0.15",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["frontend", "src/web/static-app"]

[tool.ruff.lint]
# Baseline gate adopted 2026-09: E501 stays unenforced until a dedicated
# formatting pass reflows the ~270 existing long lines; F403/F405 are
# tolerated only in the routes package, which re-exports the shared helpers
# via `from .common import *` until that import is made explicit.
extend-ignore = ["E501"]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request dependencies as call results in parameter
# defaults; that idiom is immutable by contract, not a computed default.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
"src/web/routes/*" = ["F403", "F405"]
# Test modules bootstrap sys.path before their imports.
"tests/*" = ["E402"]
# viz_mockups bootstraps the repository src tree before its imports.
"scripts/viz/viz_mockups.py" = ["E402"]
# The CDP teardown blocks deliberately keep their compact
# `session.close(); process.kill()` one-liner style.
"tests/test_browser_cutover.py" = ["E701", "E702"]

[tool.mypy]
# The core domain package is pure (stdlib + pydantic) and carries the strict
# gate. The web layer joins the gate after the routes' star-import cleanup
# and JSON-boundary annotations land; enabling it today only produces noise
# from `from .common import *` re-exports and untyped JSON shapes.
files = ["src/perovskite_bo"]
mypy_path = "src"
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["pydantic.*", "pydantic"]
# pydantic v2 ships types, but its decorator rewrites and model_dump surface
# stay partly Any-typed.
disallow_any_generics = false
warn_return_any = false

[project.scripts]
perovskite-workflow-web = "web.app:main"
perovskite-workflow-admin = "web.admin_cli:main"
